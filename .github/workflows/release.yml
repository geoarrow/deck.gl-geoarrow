name: Publish Package to NPM

# Only run on new tags starting with `v`
on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  build-publish:
    environment: npm-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never use caching in release builds

      - run: pnpm install
      - run: pnpm build
      - run: pnpm test

      - name: Read version and publish
        env:
          # Clear the sentinel value setup-node writes; otherwise npm tries to
          # use it as a bearer token and rejects OIDC.
          # https://github.com/actions/setup-node/issues/1440#issuecomment-3571890875
          NODE_AUTH_TOKEN: ""
        run: |
          VERSION=$(jq -r .version packages/deck.gl-geoarrow/package.json)
          if [[ "$VERSION" == *alpha* || "$VERSION" == *beta* ]]; then
            pnpm --filter @geoarrow/deck.gl-geoarrow publish --no-git-checks --tag beta
          else
            pnpm --filter @geoarrow/deck.gl-geoarrow publish --no-git-checks
          fi
